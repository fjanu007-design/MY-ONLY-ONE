<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glad That We Met ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">


<style>

    * {
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
    }


    body {

        margin: 0;

        min-height: 100vh;

        background: #fff5f8;

        color: #438fd9;

        font-family: "Quicksand", sans-serif;

        overflow-x: hidden;

    }


    /* =========================
       BLUE BACKGROUND DOODLES
    ========================= */

    .doodle {

        position: fixed;

        pointer-events: none;

        z-index: 0;

        font-family: "Caveat", cursive;

    }


    .star {

        color: #72b4f2;

        font-size: 48px;

        opacity: 0.65;

    }


    .s1 {
        top: 5%;
        left: 5%;
        transform: rotate(-15deg);
    }


    .s2 {
        top: 20%;
        right: 5%;
        transform: rotate(15deg);
    }


    .s3 {
        top: 55%;
        left: 4%;
        transform: rotate(10deg);
    }


    .s4 {
        bottom: 15%;
        right: 7%;
        transform: rotate(-15deg);
    }


    .heart {

        color: #78b8f5;

        font-size: 40px;

        opacity: 0.65;

    }


    .h1 {
        top: 40%;
        right: 3%;
    }


    .h2 {
        bottom: 8%;
        left: 5%;
    }


    /* =========================
       MAIN PAGE
    ========================= */

    .page {

        position: relative;

        z-index: 2;

        width: min(900px, 90%);

        margin: auto;

        padding: 85px 0 130px;

        text-align: center;

    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 18px;

        margin-bottom: 60px;

    }


    .line {

        width: min(260px, 28vw);

        height: 3px;

        background: #72afe9;

        border-radius: 10px;

    }


    .divider-heart {

        font-family: "Caveat", cursive;

        font-size: 52px;

        color: #438fd9;

        line-height: 1;

    }


    /* =========================
       FIRST MEET PHOTO
       1536 × 927
       LANDSCAPE
    ========================= */

    .first-meet-frame {

        width: min(780px, 100%);

        margin: 0 auto;

        padding: 11px;

        background: #63aaf0;

        border-radius:
            4% 7% 5% 6% /
            7% 5% 6% 5%;

        box-shadow:
            0 12px 32px rgba(70, 145, 220, 0.20);

        transform: rotate(-1deg);

        position: relative;

    }


    .first-meet-frame::before {

        content: "";

        position: absolute;

        inset: -9px;

        border: 4px solid #b8ddff;

        border-radius:
            5% 7% 6% 4% /
            7% 5% 6% 5%;

        pointer-events: none;

    }


    .first-meet-frame img {

        display: block;

        width: 100%;

        height: auto;

        border-radius: 3px;

    }


    /* =========================
       FIRST MEET TEXT
    ========================= */

    .memory-text {

        margin: 48px auto 115px;

        max-width: 800px;

        font-family: "Caveat", cursive;

        font-size: clamp(31px, 5vw, 49px);

        line-height: 1.35;

        font-weight: 700;

        color: #438fd9;

    }


    /* =========================
       FIRST TEXT PHOTO
       957 × 1536
       PORTRAIT
    ========================= */

    .first-text-frame {

        width: min(480px, 78%);

        margin: 0 auto;

        padding: 10px;

        background: #63aaf0;

        border-radius:
            5% 7% 6% 5% /
            4% 6% 5% 7%;

        box-shadow:
            0 12px 32px rgba(70, 145, 220, 0.20);

        transform: rotate(1.2deg);

        position: relative;

    }


    .first-text-frame::before {

        content: "";

        position: absolute;

        inset: -9px;

        border: 4px solid #b8ddff;

        border-radius:
            6% 5% 7% 5% /
            5% 7% 4% 6%;

        pointer-events: none;

    }


    .first-text-frame img {

        display: block;

        width: 100%;

        height: auto;

        border-radius: 3px;

    }


    /* =========================
       SECOND TEXT
    ========================= */

    .second-text {

        margin-top: 48px;

        margin-bottom: 100px;

    }


    /* =========================
       GO BACK
    ========================= */

    .back-area {

        display: flex;

        justify-content: flex-end;

        margin-top: 50px;

    }


    .back-button {

        display: inline-block;

        padding: 13px 30px;

        background: #78b8f5;

        color: white;

        text-decoration: none;

        border-radius:
            18px 12px 20px 14px;

        font-family: "Caveat", cursive;

        font-size: 31px;

        font-weight: 700;

        box-shadow:
            0 7px 18px rgba(70, 145, 220, 0.20);

        transition: 0.3s ease;

    }


    .back-button:hover {

        transform: translateY(-4px);

        background: #5fa7ed;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {


        .page {

            width: 88%;

            padding-top: 65px;

            padding-bottom: 100px;

        }


        .divider {

            margin-bottom: 45px;

        }


        .line {

            width: 25vw;

        }


        .first-meet-frame {

            width: 100%;

            padding: 8px;

        }


        .memory-text {

            font-size: 31px;

            line-height: 1.4;

            margin-top: 40px;

            margin-bottom: 85px;

        }


        .first-text-frame {

            width: 82%;

            padding: 8px;

        }


        .second-text {

            margin-top: 40px;

            margin-bottom: 70px;

        }


        .back-area {

            margin-top: 40px;

        }


        .back-button {

            font-size: 28px;

            padding: 11px 25px;

        }

    }

</style>

</head><body><!-- BLUE DOODLES -->

<div class="doodle star s1">✦</div>

<div class="doodle star s2">✦</div>

<div class="doodle star s3">✦</div>

<div class="doodle star s4">✦</div>

<div class="doodle heart h1">♡</div>

<div class="doodle heart h2">♡</div>



<main class="page">


    <!-- TOP DIVIDER -->

    <div class="divider">

        <div class="line"></div>

        <div class="divider-heart">♡</div>

        <div class="line"></div>

    </div>



    <!-- =========================
         FIRST MEET
    ========================= -->

    <div class="first-meet-frame">

        <img
            src="gladwemeet.jpg"
            alt="Our first meet"
        >

    </div>


    <div class="memory-text">

        I'll be always glad for this gc
        (even though I have trauma from this 🧍🏻‍♀️

    </div>



    <!-- =========================
         FIRST TEXT
    ========================= -->

    <div class="first-text-frame">

        <img
            src="firsttext.jpg"
            alt="Our first text"
        >

    </div>


    <div class="memory-text second-text">

        It was actually iconic how we started talking.
        You were seriously so cute :(
        Do you still think I'm Boston?
        If yes, please take it back.
        I'm Dean now and you are my Moth hehe

    </div>



    <!-- =========================
         GO BACK
    ========================= -->

    <div class="back-area">

        <a href="letter.html" class="back-button">

            go back

        </a>

    </div>


</main>

</body></html>
