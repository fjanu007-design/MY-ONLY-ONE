<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Only One ♡</title>

    <!-- Cute fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff7fa;
            color: #633d4b;
            font-family: "Quicksand", sans-serif;
        }

        .opening {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 70px 20px 80px;
        }

        /* MAIN TITLE */

        h1 {
            margin: 0;

            font-family: "Caveat", cursive;
            font-size: clamp(55px, 15vw, 95px);
            font-weight: 600;

            letter-spacing: 3px;

            color: #f19ab3;

            line-height: 1;
        }

        /* SUBTITLE */

        .made-by {
            margin-top: 8px;

            font-family: "Caveat", cursive;
            font-size: 25px;

            color: #9d6879;
        }

        /* PHOTO */

        .photo {
            width: min(90vw, 650px);

            margin-top: 45px;

            border-radius: 22px;

            box-shadow:
                0 15px 40px rgba(180, 100, 125, 0.20);

            animation: photoAppear 1.4s ease;
        }

        /* BIRTHDAY MESSAGE */

        .birthday {
            margin-top: 35px;

            font-family: "Caveat", cursive;

            font-size: clamp(38px, 9vw, 60px);

            font-weight: 600;

            color: #e88ca8;

            animation: appear 1.5s ease;
        }

        /* OPEN LETTER BUTTON */

        .open-letter {
            display: inline-block;

            margin-top: 25px;

            padding: 14px 30px;

            border-radius: 50px;

            background: #f3a7bd;

            color: white;

            text-decoration: none;

            font-family: "Caveat", cursive;

            font-size: 27px;

            font-weight: 600;

            box-shadow:
                0 8px 20px rgba(210, 120, 145, 0.25);

            transition: 0.3s ease;
        }

        .open-letter:hover {
            transform: translateY(-4px) scale(1.03);

            background: #eb96b0;

            box-shadow:
                0 12px 25px rgba(210, 120, 145, 0.35);
        }

        /* ANIMATIONS */

        @keyframes photoAppear {

            from {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

</head>


<body>

    <main class="opening">

        <h1>
            MY ONLY ONE
        </h1>

        <p class="made-by">
            made by your last one
        </p>

        <img
            src="birthday.jpg"
            alt="Our memory"
            class="photo"
        >

        <h2 class="birthday">
            Happy birthday my love💕
        </h2>

        <a href="letter.html" class="open-letter">
            open letter 🦭
        </a>

    </main>

</body>

</html>
